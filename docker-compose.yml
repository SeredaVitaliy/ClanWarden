services:
  bot:
    image: ghcr.io/seredavitaliy/clanwarden:latest
    # To build from source instead of pulling the image: docker compose up -d --build
    build: .
    container_name: clanwarden
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
