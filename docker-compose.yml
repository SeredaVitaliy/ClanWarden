services:
  bot:
    image: ghcr.io/seredavitaliy/coc-war-bot:latest
    # Чтобы собрать образ из исходников вместо готового: docker compose up -d --build
    build: .
    container_name: coc-war-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
