[project]
name = "clan-warden"
version = "1.0.0"
description = "Self-hosted Clash of Clans Telegram bot: clan war & CWL tracking, attack reminders with mentions"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["clash-of-clans", "telegram-bot", "aiogram", "clan-war", "cwl"]
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
clan-warden = "clanwarden.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clanwarden*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Message catalogs: long strings read better than wrapped ones.
"clanwarden/i18n/*.py" = ["E501"]
# Demo data and inline CSS for README images.
"scripts/render_previews.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
